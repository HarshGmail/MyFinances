name: myfinances

services:
  backend:
    container_name: myfinances-backend
    build: ../../backend
    env_file: backend.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      PDF_PARSING_SERVICE_URL: http://pdf-parsing:8080
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - pdf-parsing
    restart: always

  mcp:
    container_name: myfinances-mcp
    build: ../../mcp-server
    env_file: mcp.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      BACKEND_URL: http://backend:5000/api
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - backend
    restart: always

  pdf-parsing:
    container_name: myfinances-pdf-parsing
    build: ../../pdf-parsing
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: always

  tunnel:
    container_name: myfinances-tunnel
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend
      - mcp
    restart: always
    profiles:
      - public
